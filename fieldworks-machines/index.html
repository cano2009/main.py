<style>

}

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 28px; display: grid; gap: 14px; }

.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 6vw, 40px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance; }
.wallet { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wallet b { color: var(--fg); font-size: 18px; font-weight: 500; }
.picker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pick { font: 600 13.5px var(--font-body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 9px 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; }

@media (min-width: 900px) { .stage.inspecting { grid-template-columns: minmax(0, 1fr) 340px; } }

@media (max-width: 640px) { .viewport { aspect-ratio: 4 / 4.4; } .picker { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.chip-status span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }

.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width: 0; }
.stat .k { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow">Fieldworks · wash line</div>

        <button type="button" class="tab" role="tab" id="tab-resources" aria-selected="false">Resources</button>
        <button type="button" class="tab" role="tab" id="tab-upgrades" aria-selected="false">Upgrades</button>
        <button type="button" class="tab" role="tab" id="tab-operation" aria-selected="false">Operation</button>

    </aside>
  </div>

  <div class="strip" id="strip"></div>

  <div class="controls">
    <button type="button" class="btn" id="b-inspect">Inspect</button>
    <span id="actions" class="controls"></span>
    <span class="sep"></span>
    <div class="chips" role="group" aria-label="Produce">
      <span class="label">Produce</span>
      <button type="button" class="chip" id="crop-pumpkin" aria-pressed="true">Pumpkin</button>
      <button type="button" class="chip" id="crop-potato" aria-pressed="false">Potato</button>
      <button type="button" class="chip" id="crop-carrot" aria-pressed="false">Carrot</button>
      <button type="button" class="chip" id="crop-cabbage" aria-pressed="false">Cabbage</button>
      <button type="button" class="chip" id="crop-watermelon" aria-pressed="false">Melon</button>
    </div>
  </div>
  <p class="note" id="note"></p>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

import { createGlow } from './glow.js';
import { createOutlines } from './outline.js';
import * as P from './parts.js';
import { build, conveyor, BELT_Y } from './washer.js';
import { Machine, WASHER_DEF, money } from './machine.js';
import { Generator, GEN_DEF, buildGenerator } from './generator.js';

await new Promise((r) => { const s = document.createElement('script'); s.src = 'crops.js'; s.onload = r; s.onerror = r; document.head.appendChild(s); });

const CONVEYOR_KW = 0.37;
const PICKX = 2.76;                                    // where items stop at the end of the outfeed belt
const ROBOT_BASE = new V(3.45, 0, -0.35);
const CRATE = new V(4.38, 0, -0.35);
const GEN_POS = new V(-2.75, 0, -2.05);

Object.assign(sun.shadow.camera, { left: -7.5, right: 7.5, top: 7.5, bottom: -7.5, far: 45 });

gfx.setGrade('farm', 0);
gfx.setEnvironment('room');
const glow = createGlow({ scene, quality: touch ? 'medium' : 'high' });
const outlines = createOutlines({ gfx, scene, camera, quality: touch ? 'low' : 'high' });

// ---------- yard ----------
const ground = new THREE.Mesh(new THREE.CircleGeometry(100, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: new THREE.Color('#6f7f3e').convertSRGBToLinear(), roughness: 1 }));
ground.position.y = -0.02; ground.receiveShadow = true; scene.add(ground);
(function pad() {
  const W = 11.6, D = 6.0, g = new THREE.PlaneGeometry(W, D, 116, 60).rotateX(-Math.PI / 2);
  const pos = g.attributes.position, cols = [], base = new THREE.Color('#8f8c86').convertSRGBToLinear(), yel = new THREE.Color('#e0aa2a').convertSRGBToLinear();
  let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let c = base.clone().multiplyScalar(0.88 + r() * 0.16);
    if (Math.abs(((x + W / 2) % 1.5) - 0.75) > 0.73 || Math.abs(((z + D / 2) % 1.5) - 0.75) > 0.73) c.multiplyScalar(0.8);
    if ((Math.abs(z - 1.55) < 0.05 && x < 3) || (Math.abs(x - 2.98) < 0.05 && z > -1.6 && z < 1.0) || (Math.abs(z - 1.0) < 0.05 && x > 2.98) || (Math.abs(z + 1.75) < 0.05 && x > 2.98)) c = yel.clone();
    cols.push(c.r, c.g, c.b);
  }

  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 })); m.position.set(0.55, 0.001, -0.5); m.receiveShadow = true; scene.add(m);
})();

// ---------- machines ----------
const M = P.materials();
const ws = build(M); scene.add(ws.root);
const infeed = conveyor(-3.4, -1.02, M, { driveAt: 'tail' }); scene.add(infeed.group);
const outfeed = conveyor(1.02, 2.95, M, { driveAt: 'head' }); scene.add(outfeed.group);
const stop = P.panel(0.03, 0.06, 0.5, M.paint2, 0.006); stop.position.set(2.96, BELT_Y + 0.03, 0); scene.add(stop);
const gen = buildGenerator(M); gen.root.position.copy(GEN_POS); scene.add(gen.root);
const rob = buildRobot(M); rob.root.position.copy(ROBOT_BASE); scene.add(rob.root);
// crate on a pallet
const crateG = new THREE.Group(); crateG.position.copy(CRATE); scene.add(crateG);
const wood = new THREE.MeshStandardMaterial({ color: new THREE.Color('#a27b4d').convertSRGBToLinear(), roughness: 0.85 });
const woodD = new THREE.MeshStandardMaterial({ color: new THREE.Color('#7d5a36').convertSRGBToLinear(), roughness: 0.9 });
for (let k = 0; k < 6; k++) { const p = P.panel(1.0, 0.022, 0.14, wood, 0.004); p.position.set(0, 0.07, -0.43 + k * 0.172); crateG.add(p); }
[-1, 0, 1].forEach((k) => { const p = P.panel(0.1, 0.06, 1.0, woodD, 0.006); p.position.set(k * 0.45, 0.03, 0); crateG.add(p); });

for (let rr = 0; rr < 3; rr++) {
  const y = 0.15 + rr * 0.15;
  [0.48, -0.48].forEach((z) => { const b = P.panel(0.96, 0.11, 0.024, wood, 0.004); b.position.set(0, y, z); crateG.add(b); });
  [0.48, -0.48].forEach((x) => { const b = P.panel(0.024, 0.11, 0.96, wood, 0.004); b.position.set(x, y, 0); crateG.add(b); });
}
[[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([a, c]) => { const p = P.panel(0.05, 0.46, 0.05, woodD, 0.006); p.position.set(a * 0.47, 0.32, c * 0.47); crateG.add(p); cb.row(new V(a * 0.47, 0.18, c * 0.497), new V(a * 0.47, 0.48, c * 0.497), new V(0, 0, c), 3, 0.006); });
cb.build(crateG);
// power cables: generator -> washer cabinet -> robot controller, laid on the floor
const gT = gen.terminal.clone().add(GEN_POS);
scene.add(P.pipe([[gT.x, gT.y, gT.z], [gT.x + 0.35, gT.y, gT.z - 0.1], [gT.x + 0.35, 0.03, gT.z - 0.1], [1.44, 0.03, gT.z - 0.1], [1.44, 0.03, -0.92], [1.44, 0.84, -0.92]], 0.022, M.cable, M, { flanges: false, bend: 0.14 }));
scene.add(P.pipe([[1.5, 0.03, -1.0], [3.0, 0.03, -1.0], [3.0, 0.03, -1.23], [3.15, 0.03, -1.23]], 0.018, M.cable, M, { flanges: false, bend: 0.1 }));
[[-0.5, gT.z - 0.1], [0.6, gT.z - 0.1]].forEach(([x, z]) => { const r = P.panel(0.5, 0.035, 0.16, M.paint2, 0.01); r.position.set(x, 0.018, z); scene.add(r); });

// lights that show state
const gM = glow.attach(ws.machine, { state: 'running' });
gM.stackLight({ position: new V(0.82, ws.HOOD_T + 0.05, 0.38) });
gM.strip({ from: new V(-ws.X + 0.06, ws.HOOD_T - 0.03, ws.Z + 0.045), to: new V(ws.X - 0.06, ws.HOOD_T - 0.03, ws.Z + 0.045), width: 0.012 });
gM.led({ position: ws.live.cabinetLed, size: 0.012 });
const gPump = glow.attach(ws.root, { state: 'flow' }); gPump.led({ position: new V(-0.48, 0.32, -0.98), size: 0.014 });
const gIn = glow.attach(infeed.group, { state: 'running' }); gIn.strip({ from: new V(-3.38, BELT_Y - 0.12, 0.33), to: new V(-1.05, BELT_Y - 0.12, 0.33), width: 0.01 });
const gOut = glow.attach(outfeed.group, { state: 'running' }); gOut.strip({ from: new V(1.05, BELT_Y - 0.12, 0.33), to: new V(2.93, BELT_Y - 0.12, 0.33), width: 0.01 });
const gGen = glow.attach(gen.root, { state: 'running' });
gGen.stackLight({ position: new V(0.85, 1.52, 0.38), radius: 0.03, segment: 0.06 });
gGen.strip({ from: new V(0.3, 1.38, 0.583), to: new V(0.8, 1.38, 0.583), width: 0.01 });
const gRob = glow.attach(rob.root, { state: 'waiting' });
gRob.stackLight({ position: rob.cabinetTop.clone().add(new V(0.15, 0.03, 0.1)), radius: 0.028, segment: 0.06 });
gRob.strip({ from: new V(-0.2, 0.352, 0.2), to: new V(0.2, 0.352, 0.2), width: 0.01 });
// selectable objects
const KEY_OF = new Map([[ws.root, 'washer'], [ws.console, 'washer'], [rob.root, 'robot'], [gen.root, 'generator']]);
KEY_OF.forEach((_, o) => outlines.register(o));
const ROOT_OF = { washer: ws.root, robot: rob.root, generator: gen.root };

// ---------- simulations ----------
const sim = new Machine(WASHER_DEF);
const gsim = new Generator(GEN_DEF, true);
const rsim = new RobotSim(ROBOT_DEF);
const robot = new RobotController(rob, rsim, ROBOT_BASE);
let wallet = 6000, crop = 'pumpkin', supplyT = 0;
const SIMS = { washer: sim, robot: rsim, generator: gsim };

// ---------- produce ----------
const L = window.FWCrops ? FWCrops.leafTexture() : null;
const leafTex = L ? Object.assign(new THREE.DataTexture(L.data, L.width, L.height), { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, needsUpdate: true }) : null;

const geoCache = new Map();
function itemGeo(key, seed, dirty) {

    g.computeBoundingBox(); const bb = g.boundingBox;
    g.translate(-(bb.min.x + bb.max.x) / 2, -bb.min.y, -(bb.min.z + bb.max.z) / 2);

let layout = crateLayout(crop);
const items = [], crateItems = [];
function applyCropLimits() { const d = dims(crop); sim.outLimit = Math.max(1, Math.floor((PICKX + d.len / 2 - 1.02) / (d.len + 0.03))); }
applyCropLimits();
function spawn() {
  if (!sim.canAccept() || items.some((i) => i.stage === 'infeed' && i.x < -2.95)) return;
  const seed = 1 + Math.floor(Math.random() * 3), gD = itemGeo(crop, seed, true), gC = itemGeo(crop, seed, false);
  const obj = new THREE.Group(), dm = new THREE.Mesh(gD, dirtyMat), cm = new THREE.Mesh(gC, cleanMat);
  [dm, cm].forEach((m) => { m.castShadow = true; m.receiveShadow = true; obj.add(m); }); cm.visible = false;
  obj.rotation.y = (Math.random() - 0.5) * 0.25;
  const d = dims(crop);
  const it = { obj, dm, cm, x: -3.3, z: (Math.random() - 0.5) * 0.08, stage: 'infeed', crop, label: crop, ...d };
  obj.position.set(it.x, BELT_Y, it.z); scene.add(obj);
  items.push(it); sim.feed(it);
}
function flowItems(dt) {
  const powered = gsim.outputOn();
  const v = powered && sim.on && !sim.fault ? sim.level.beltSpeed : 0;
  let edge = -1.0;
  sim.inBuffer.forEach((it) => { const target = edge - it.len / 2 - 0.03; it.x = Math.min(target, it.x + v * dt * 1.2); edge = it.x - it.len / 2; it.obj.position.x = it.x; });
  sim.slots.forEach((s) => { const it = s.item; it.stage = 'machine'; it.x = -0.8 + s.progress * 1.6; it.obj.position.set(it.x, BELT_Y + 0.004 + 0.005 * Math.abs(Math.sin(it.x * 30)), it.z); if (s.progress > 0.45 && !it.cleanShown) { it.dm.visible = false; it.cm.visible = true; it.cleanShown = true; } });
  let front = null;
  sim.outBuffer.forEach((it, i) => {
    it.stage = 'outfeed'; it.dm.visible = false; it.cm.visible = true;
    const target = i === 0 ? PICKX : front - 0.03 - it.len / 2;
    it.x = Math.min(target, it.x + v * dt); it.obj.position.set(it.x, BELT_Y, it.z * 0.98);

    front = it.x - it.len / 2;

}
const env = {
  pickReady: () => { const it = sim.outBuffer[0]; return it && it.atPick ? it : null; },
  take: (it) => { const t = sim.take(); if (t) t.stage = 'robot'; return t || it; },
  crateFull: () => crateItems.length >= layout.cap,
  nextSlot: () => crateItems.length,
  kg: (it) => CROP_KG[it.crop] || 1,
  slotPos: (i, it) => {
    const per = layout.nx * layout.nz, layer = Math.floor(i / per), j = i % per;
    const cx = j % layout.nx, cz = Math.floor(j / layout.nx);
    return new V(CRATE.x - 0.46 + (cx + 0.5) * 0.92 / layout.nx, 0.1 + layer * (it.h + 0.005), CRATE.z - 0.46 + (cz + 0.5) * 0.92 / layout.nz);
  },
  release: (it, pos) => { scene.attach(it.obj); it.obj.position.copy(pos); it.stage = 'crate'; crateItems.push(it); }
};
function sellCrate() {
  if (!crateItems.length) return { msg: 'The crate is empty' };
  let money_ = 0; const n = crateItems.length;
  crateItems.forEach((it) => { money_ += VALUE[it.crop] || 1; scene.remove(it.obj); const k = items.indexOf(it); if (k >= 0) items.splice(k, 1); });
  crateItems.length = 0;
  return { cost: -money_, msg: `Sold ${n} washed ${n === 1 ? 'item' : 'items'} for ${money(money_)}` };
}

// ---------- power network ----------
function consumers() {
  const beltsOn = sim.on && sim.powered && !sim.fault;
  return [
    { name: 'WS-300 washer', kw: sim.powerKw() },
    { name: 'Conveyors (2)', kw: beltsOn ? CONVEYOR_KW * 2 : 0 },
    { name: 'FR-6 robot', kw: rsim.powerKw() }
  ];
}

// ---------- UI ----------
const STC = { running: 'var(--ok)', waiting: 'var(--warn)', stopped: 'var(--bad)', off: 'var(--off)' };
let toastT = 0;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }
let selected = 'overview', tab = 'overview', inspecting = false;
const TABS = ['overview', 'performance', 'resources', 'upgrades', 'operation'];
const VIEWS = {
  overview: { pos: [5.2, 4.6, 6.6], tgt: [0.4, 0.6, -0.6] },
  washer: { pos: [3.1, 2.3, 4.6], tgt: [-0.1, 0.85, 0] },
  robot: { pos: [6.0, 2.5, 2.4], tgt: [3.7, 0.75, -0.3] },
  generator: { pos: [-0.6, 2.1, 0.6], tgt: [-2.75, 0.8, -2.05] }
};
const NOTES = {
  overview: 'One working line: the generator powers everything, the washer cleans produce from the field, and the robot stacks it in the crate. They depend on each other. If the robot falls behind, the outfeed belt fills and the washer waits. If the generator stops, everything stops. Upgrade the washer to level 3 and it needs more power than a level 1 generator can give.',
  washer: 'Every number on its screens, gauge and lights comes from the machine itself: items actually washed, water actually used, wear from running time.',
  robot: 'The arm works out its joint angles from where it has to reach, keeps the gripper pointing straight down, and moves each joint at its rated speed. Upgrades make it faster and let it lift heavier produce.',
  generator: 'The diesel engine supplies the line\'s real power demand. Fuel use follows the load, the coolant warms up with work, and the breaker trips if the line asks for more than the set is rated for.'
};
let camAnim = null;
function focus(key) {
  const v = VIEWS[key];
  camAnim = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: new V(...v.pos), t1: new V(...v.tgt) };
}
function select(key, open) {
  selected = key;
  ['overview', 'washer', 'robot', 'generator'].forEach((k) => $('pick-' + k).setAttribute('aria-pressed', String(k === key)));
  focus(key);
  outlines.select(key === 'overview' ? null : ROOT_OF[key]);
  if (key === 'overview') openInspect(false); else if (open || inspecting) openInspect(true);
  $('b-inspect').hidden = key === 'overview';
  render(true);
}
function openInspect(on) { inspecting = on && selected !== 'overview'; $('sheet').hidden = !inspecting; $('stage').classList.toggle('inspecting', inspecting); requestAnimationFrame(resize); render(true); }
['overview', 'washer', 'robot', 'generator'].forEach((k) => { $('pick-' + k).onclick = () => select(k, false); });
TABS.forEach((t) => { $('tab-' + t).onclick = () => { tab = t; TABS.forEach((u) => $('tab-' + u).setAttribute('aria-selected', String(u === t))); render(true); }; });
$('close').onclick = () => openInspect(false);
$('b-inspect').onclick = () => openInspect(!inspecting);
['pumpkin', 'potato', 'carrot', 'cabbage', 'watermelon'].forEach((k) => {
  $('crop-' + k).onclick = () => {
    if (crop === k) return;
    crop = k; layout = crateLayout(crop); applyCropLimits();
    ['pumpkin', 'potato', 'carrot', 'cabbage', 'watermelon'].forEach((u) => $('crop-' + u).setAttribute('aria-pressed', String(u === k)));
    toast(`Field supply switched to ${k}. New crate holds ${layout.cap}`);
  };
});
function doAction(id) {
  const s = SIMS[selected];
  const res = id === 'sell' ? sellCrate() : s.act(id, wallet);
  if (!res) return;
  if (res.cost) wallet -= res.cost;
  toast(res.msg); render(true);
}

function panelFor(key) { return key === 'generator' ? gsim.panel({ consumers: consumers() }) : SIMS[key].panel(); }
function overviewPanel() {
  const w = sim.panel(), r = rsim.panel(), g = gsim.panel({ consumers: consumers() });
  const all = [w, r, g], worst = all.find((p) => p.status === 'stopped') || all.find((p) => p.status === 'off') || all.find((p) => p.status === 'waiting');
  return {
    status: worst ? worst.status : 'running', reason: worst ? `${worst.title.split(' ')[0]}: ${worst.reason}` : 'Line running',
    strip: [w.strip[0], { k: 'Robot picks', v: r.strip[0].v }, { k: 'Power', v: g.strip[0].v, f: g.strip[0].f, c: g.strip[0].c }, { k: 'Fuel', v: g.strip[3].v, f: g.strip[3].f, c: g.strip[3].c }, { k: 'Output belt', v: w.strip[6].v, f: w.strip[6].f }, { k: 'Crate', v: r.strip[6].v, f: r.strip[6].f }],
    actions: [{ id: 'sell', label: crateItems.length ? `Sell crate (${crateItems.length})` : 'Sell crate', primary: true }]
  };
}
let lastActions = '';
function render(force) {
  const pd = selected === 'overview' ? overviewPanel() : panelFor(selected);
  $('title').textContent = selected === 'overview' ? 'Wash line' : pd.title;
  $('eyebrow').textContent = selected === 'overview' ? 'Fieldworks · wash line' : `Fieldworks · ${pd.sub.split(' · ')[1].toLowerCase()}`;
  $('note').textContent = NOTES[selected];
  $('st-dot').style.background = STC[pd.status]; $('st-text').textContent = pd.reason;
  ['washer', 'robot', 'generator'].forEach((k) => { $('dot-' + k).style.background = STC[SIMS[k].status()]; });
  $('wallet').textContent = money(wallet);
  $('strip').innerHTML = pd.strip.map((s) => `<div class="stat"><div class="k">${s.k}</div><div class="v">${s.v}</div>${s.f !== undefined ? `<div class="meter"><i style="width:${Math.max(0, Math.min(1, s.f)) * 100}%;${s.c ? 'background:' + s.c : ''}"></i></div>` : ''}</div>`).join('');
  const aKey = JSON.stringify(pd.actions);
  if (force || aKey !== lastActions) {
    lastActions = aKey;
    $('actions').innerHTML = pd.actions.map((a) => `<button type="button" class="btn${a.primary ? ' primary' : ''}" data-act="${a.id}"${a.disabled ? ' disabled' : ''}>${a.label}</button>`).join('');
    $('actions').querySelectorAll('button').forEach((b) => { b.onclick = () => doAction(b.dataset.act); });
  }
  $('b-inspect').textContent = inspecting ? 'Hide details' : 'Inspect';
  if (!inspecting) return;
  $('i-name').textContent = pd.title;
  $('i-sub').innerHTML = `${pd.sub} · <span class="pill" style="color:${STC[pd.status]}">${pd.status}</span>`;
  const t = pd.tabs[tab], rows = (r) => `<dl>${r.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  let h = '';
  if (tab === 'upgrades') h = rows(t.rows) + `<div class="log">${t.gains.map((g) => '<div>' + g + '</div>').join('')}</div>`;
  else if (tab === 'operation') h = rows(t.rows) + `<div class="log">${t.log.map((l) => `<div>${l.t.toFixed(0).padStart(4, ' ')}s  ${l.text}</div>`).join('') || '<div>No events yet</div>'}</div>`;
  else h = rows(t);
  $('tab-body').innerHTML = h;
}

// tap or click a machine
const down = { x: 0, y: 0 };
const ndc = (e) => { const rc = renderer.domElement.getBoundingClientRect(); return new THREE.Vector2(((e.clientX - rc.left) / rc.width) * 2 - 1, -((e.clientY - rc.top) / rc.height) * 2 + 1); };
renderer.domElement.addEventListener('pointerdown', (e) => { down.x = e.clientX; down.y = e.clientY; camAnim = null; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
  const hit = outlines.pick({ pointer: ndc(e), reach: 40 });
  if (hit) { tab = 'overview'; TABS.forEach((u) => $('tab-' + u).setAttribute('aria-selected', String(u === 'overview'))); select(KEY_OF.get(hit), true); }
});
renderer.domElement.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') outlines.hover(outlines.pick({ pointer: ndc(e), reach: 40 })); });

function resize() { const w = host.clientWidth, h = host.clientHeight; camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); gfx.resize(w, h); outlines.resize(); }
new ResizeObserver(resize).observe(host);

// ---------- loop ----------
function tick(dt) {
  const cons = consumers(), demand = cons.reduce((a, c) => a + c.kw, 0);
  gsim.tick(dt, demand);
  const powered = gsim.outputOn();
  sim.powered = powered; rsim.powered = powered;
  supplyT -= dt;
  if (supplyT <= 0) { spawn(); supplyT = SUPPLY_S[crop] / (0.7 + sim.levelIndex * 0.35); }
  sim.tick(dt);
  flowItems(dt);
  robot.tick(dt, env);
  rsim.crate.count = crateItems.length; rsim.crate.cap = layout.cap;
  const s = sim.stats(), st = s.identity.status;
  gM.setState(st); gPump.setState(st === 'running' ? 'flow' : st === 'waiting' ? 'waiting' : st === 'off' ? 'off' : 'stopped');
  const beltOn = powered && sim.on && !sim.fault;
  gIn.setState(!beltOn ? (powered ? 'off' : 'stopped') : sim.inBuffer.length ? 'running' : 'waiting');
  gOut.setState(!beltOn ? (powered ? 'off' : 'stopped') : sim.outBuffer.length >= sim.outCap() ? 'waiting' : 'running');
  gGen.setState(gsim.status()); gRob.setState(rsim.status());
  const v = beltOn ? sim.level.beltSpeed : 0;
  [infeed, outfeed].forEach((c) => { c.tex.offset.x -= v * dt / 0.1; c.drums.forEach((d) => { d.rotation.z -= v * dt / 0.06; }); if (c.motorShaft) c.motorShaft.rotation.x += v * dt * 60; });
  ws.animate(dt, s, items.filter((i) => i.stage === 'machine' || i.stage === 'infeed' || i.stage === 'outfeed'));
  gen.animate(dt, gsim, { reason: gsim.reason() });
}
window.__fw = { camera, controls, sim, gsim, rsim, robot, items, crateItems, select, openInspect, setTab: (t) => $('tab-' + t).click(), step: (secs) => { for (let i = 0; i < secs * 30; i++) tick(1 / 30); }, doAction };
const clock = new THREE.Clock();
let uiT = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  tick(dt);
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt / 0.9); const e = camAnim.t * camAnim.t * (3 - 2 * camAnim.t);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e); controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  glow.update(dt, camera); outlines.update(dt); controls.update();
  uiT -= dt; if (uiT <= 0) { uiT = 0.25; render(false); }
  gfx.render(dt);
  requestAnimationFrame(loop);
}
camera.position.set(...VIEWS.overview.pos); controls.target.set(...VIEWS.overview.tgt); controls.update();
$('b-inspect').hidden = true;
resize(); render(true); loop();
</script>
