/* Low-poly power-and-water yard. Header with picker and farm account, the 3D yard, a live strip for the selection,
   its controls, world controls (time, speed, wind, weather, physics) and an inspection sheet. Single dark look. */
:root {
  --bg: #15120d; --panel: #1f1a13; --panel-2: #2a2318; --line: #3a3124; --fg: #efe6d2; --muted: #a89a80;

  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 28px; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 6vw, 40px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance; }
.wallet { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wallet b { color: var(--fg); font-size: 18px; font-weight: 500; }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 6px; }
.pick { font: 600 13.5px var(--font-body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 9px 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; white-space: nowrap; }
.pick .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
.pick[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); background: var(--panel-2); }
.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 900px) { .stage.inspecting { grid-template-columns: minmax(0, 1fr) 340px; } }
.viewport { position: relative; width: 100%; aspect-ratio: 16 / 9.2; min-height: 340px; max-height: 72vh; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #8fb4d0; }
@media (max-width: 640px) { .viewport { aspect-ratio: 4 / 4.6; } .picker { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.chip-status { position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 8px; font: 600 12px var(--font-body); background: rgba(21,18,13,0.72); color: var(--fg); padding: 6px 11px; border-radius: 999px; max-width: calc(100% - 20px); }
.chip-status span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { position: absolute; right: 10px; top: 10px; font: 500 12px var(--font-mono); background: rgba(21,18,13,0.72); color: var(--fg); padding: 6px 11px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.hint { position: absolute; left: 10px; bottom: 10px; font-family: var(--font-mono); font-size: 11px; color: #f5efe0; background: rgba(21,18,13,0.6); padding: 4px 8px; border-radius: 6px; pointer-events: none; max-width: calc(100% - 20px); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width: 0; }
.stat .k { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 5px; background: #2d261b; border-radius: 3px; margin-top: 6px; overflow: hidden; }

.world { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px 18px; }

@media (min-width: 900px) { .sheet { max-height: 72vh; overflow: auto; } }
.sheet-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.1; text-wrap: balance; }
.sheet .sub { color: var(--muted); font-size: 13px; }

.tab[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

.rule input { width: 72px; } .rule .live { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.log { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
.toast { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); background: rgba(21,18,13,0.88); border: 1px solid var(--line); padding: 7px 12px; border-radius: 8px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity 0.3s; max-width: calc(100% - 24px); text-align: center; }
.toast.show { opacity: 1; }

.pad { position: absolute; inset: auto 10px 10px 10px; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; }

.pad button { font: 700 14px var(--font-body); width: 64px; height: 56px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.25); background: rgba(21,18,13,0.7); color: var(--fg); touch-action: none; user-select: none; -webkit-user-select: none; }

const lin = (h) => new THREE.Color(h).convertSRGBToLinear();

  wind: new V(-20, 0, -14), solar: new V(-11, 0, 5), tank: new V(12, 0, -7), pump: new V(21, 0, -2), pad: new V(8.5, 0, 2.4),

};
const FIELD = { x0: 14, x1: 30, z0: 6, z1: 18 };

// ---------- renderer, scene, camera ----------
const host = $('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
host.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(lin('#cfe2ee'), 70, 300);
const hemi = new THREE.HemisphereLight(lin('#d6e8f6'), lin('#6b5a3c'), 0.85); scene.add(hemi);

Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 38, bottom: -38, near: 1, far: 220 });

const NOTES = {
  parts: 'Build your own drive lines anywhere on open ground. Pick a part under Mechanical, Hydraulic or Belts and machines, then click to place it (R rotates; it stays in build mode). Parts connect when their ends meet: shafts to shafts, hoses to hoses, belts to belts and machines. A shaft line runs at the speed of its drive, gearboxes change it (the wind rotor turns slowly and needs the 1:25 step-up), and every shaft and gear loses a little. Two drives at different speeds fight, so split them with a clutch. Hydraulic power trades flow for force: a weak pump still presses, only slower, and an accumulator stores oil for a fast stroke. An open hose end sprays oil and no pressure builds. Tap a part to see its network, toggle clutches and valves, buy supply, rotate or remove it.',
  core: 'A five-bay production line fed straight from the farm. The router after the optical sorter sends the crops you tick (sunflower and soybean to start with) along the feed conveyor onto the spine. Each module works on what it understands and passes the rest: a press splits oilseed into oil and seed cake, a mill splits grain into flour and bran, a mixer turns the cake and bran byproducts into animal feed, a bottler packs oil, flour and feed for 40% more. Order matters: dry before pressing, clean first, mix after the press, pack last. A cleaner raises purity (and price) and blows out husks; a buffer tank keeps early stages running when a later one is slow. Power and heat are shared: over 6 kW you need a power cabinet, and hot modules need a cooling unit.',
  workshop: 'Design your own machine in the Operation tab: pick a frame, a drive, a transmission, a process module, an input, an output, a control and cooling. It works only as well as its parts: no motor means nothing turns, a direct shaft shears under a press, a belt slips under heavy loads, an underpowered drive runs slow, a diesel without a radiator overheats, a heavy press shakes a light frame apart. Test it, then build it; the blueprint becomes a real machine on the bay, wired to the workshop pedestal. Buy supply pallets and sell what it makes. Save good designs and reload them later.',
  digester: 'Grade C produce that the optical sorter rejects is not thrown away. The auger lifts it from the reject tote into a twin-shaft shredder, and the heated digester turns it into biogas and digestate. Biogas fills the membrane dome; the engine burns it into power for the yard and its waste heat keeps the bacteria at 38 °C (below 30 °C they slow right down). When the dome is full the flare burns the surplus. Digestate is pumped through a buried main to the soil steward as liquid fertiliser.',
  steward: 'The soil steward watches the field. Its mast scans moisture over every zone; nitrogen is only known where the rover has pushed its probe into the ground, and a sample is good for 8 hours. The straddle rover rides over the rows through the east gate, samples stale zones, and feeds hungry ones with digestate from its tank. It charges and refills at the dock. When too many zones dry out it sends the spray drone. Use the soil map to see what it knows.',
  logic: 'Write the yard\'s rules: if a sensor is above or below a value, an action holds while that stays true and releases when it does not. Sensors read anything in the yard; actions only reach machines that a purple signal cable connects to the controller. Edit the rules in the Operation tab.',

  chain: 'Wheat and corn do not get boxed on the line: the optical sorter diverts them onto the grain conveyor. The stone mill grinds two sheaves into a sack of flour (or cornmeal from corn), the tunnel oven bakes flour into bread, and the bagger packs four products per crate onto the pallet, which is sold when full. It runs on the processing line circuit.',
  build: 'Buildings stand on a foundation slab, have closed walls and a full roof, and get a collider so vehicles and crates stop at them. Remove refunds half the price.',
  field: 'Plants grow through four stages, but only while the soil is wet: the spray drone waters them. Ready plants are harvested into the bin at the start of the processing line (automatically at 90% ready, or with Harvest now) and the field is replanted. Pick a different crop to replant it.',
  line: 'Harvested crops ride the belt through the washer (3 L of tank water each, so the pump jack has to keep up), the cutter and sorter, and the packer, which presses them into boxes on the pallet. A full pallet is sold. The line runs on its own circuit: when power is short it is the second thing to be shed. Unwashed produce sells for less.',
  overview: 'A working yard where everything is connected. The wind turbine and solar array feed the power network. The battery stores what is spare, the diesel set starts on its own when both run short, and anything left over is sold to the utility through the transmission line. The pump jack lifts well water into the tank, the drone refills from it, charges from the network and sprays the field lane by lane. Try a calm night: watch the battery drain, the diesel start, and the lights go out first if power runs short.',
  wind: 'Power comes from the wind through the rotor: it rises with the cube of the wind speed until the rated output, then the blades pitch to hold it there. Below 3 m/s it waits, and in a storm above 24 m/s it feathers the blades and brakes. The nacelle turns to face the wind at 4 degrees a second.',
  solar: 'Output follows the sun\'s angle on the modules, the light reaching them (weather), cell temperature and dust. Clean the panels when output drops. At level 3 the tracker tilts the table to follow the sun.',
  tank: 'Water level rises with what the pump jack lifts and falls with the drone refills and the livestock trough. When the tank is full the pump waits. Each upgrade adds a 1.1 m steel ring.',
  pump: 'The crank, pitman arms and walking beam move as a real four-bar linkage, so the horsehead lifts the rod straight up and down. Each stroke lifts the plunger\'s volume of water from 60 m down. It stops without power and waits when the tank is full.',
  drone: 'The drone refills from the tank, charges on the pad from the power network, then flies the field lane by lane and returns when its tank is empty or its battery reaches the reserve. Sprayed plants turn green and dry out again over a few hours; when the field gets dry it starts a new mission.',
