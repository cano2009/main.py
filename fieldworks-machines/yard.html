:root {

* { box-sizing: border-box; }
[hidden] { display: none !important; }

.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 28px; display: grid; gap: 14px; }

.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 6vw, 40px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance; }
.wallet { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wallet b { color: var(--fg); font-size: 18px; font-weight: 500; }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 6px; }
.pick { font: 600 13.5px var(--font-body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 9px 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; white-space: nowrap; }

.pick[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); background: var(--panel-2); }

function panelFor(key) { return key === 'gen' ? genPanel() : SIMS[key].panel(); }
function overviewPanel() {

  return {
    status: bad ? 'stopped' : grid.status(), reason: bad ? `${NAMES[bad[0]]}: ${SIMS[bad[0]].reason()}` : grid.reason(),
    strip: [{ k: 'Generating', v: f1(F.renew + F.diesel) + ' kW' }, { k: 'Load', v: f1(F.served) + ' kW' }, { k: 'Battery', v: Math.round(socP * 100) + '%', f: socP, c: 'var(--ok)' }, { k: 'Water tank', v: Math.round(tank.frac() * 100) + '%', f: tank.frac(), c: 'var(--water)' }, { k: 'Field', v: Math.round(fieldSim.growth() * 100) + '% grown', f: fieldSim.growth(), c: 'var(--ok)' }, { k: 'Produce sold', v: money(lineSim.earned) }, { k: 'Power sold', v: money(grid.earned) }],
    actions: [{ id: 'mission', label: 'Send the drone out', disabled: drone.state !== 'done', primary: drone.state === 'done' }]

}
let lastActions = '';
function render(force) {

  $('eyebrow').textContent = selected === 'overview' ? 'Fieldworks · power and water yard' : `Fieldworks · ${pd.sub.split(' · ')[1].toLowerCase()}`;
  $('note').textContent = NOTES[selected];
  $('st-dot').style.background = STC[pd.status]; $('st-text').textContent = pd.reason;
  KEYS.slice(1).forEach((k) => { $('dot-' + k).style.background = STC[SIMS[k].status()]; });
  $('wallet').textContent = money(wallet);
  $('clock').textContent = `${clockText()} · ${f1(env.wind)} m/s · ${speed}x`;
  $('strip').innerHTML = pd.strip.map((s) => `<div class="stat"><div class="k">${s.k}</div><div class="v">${s.v}</div>${s.f !== undefined ? `<div class="meter"><i style="width:${Math.max(0, Math.min(1, s.f)) * 100}%;${s.c ? 'background:' + s.c : ''}"></i></div>` : ''}</div>`).join('');

    $('actions').innerHTML = pd.actions.map((a) => `<button type="button" class="btn${a.primary ? ' primary' : ''}" data-act="${a.id}"${a.disabled ? ' disabled' : ''}>${a.label}</button>`).join('');

  }

  if (!inspecting) return;
  $('i-name').textContent = pd.title;
  $('i-sub').innerHTML = `${pd.sub} · <span class="pill" style="color:${STC[pd.status]}">${pd.status}</span>`;
  const t = pd.tabs[tab], rows = (r) => `<dl>${r.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  let h = '';
  if (tab === 'upgrades') h = rows(t.rows) + `<div class="log">${t.gains.map((g) => '<div>' + g + '</div>').join('')}</div>`;
  else if (tab === 'operation') h = rows(t.rows) + `<div class="log">${t.log.map((l) => `<div>${l.t.toFixed(0).padStart(5, ' ')}s  ${l.text}</div>`).join('') || '<div>No events yet</div>'}</div>`;
  else h = rows(t);

}

// tap: push a prop, or select a machine
const down = { x: 0, y: 0 };
const ray = new THREE.Raycaster();

renderer.domElement.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
  camera.updateMatrixWorld(); ray.setFromCamera(ndc(e), camera);
  const hits = ray.intersectObjects([...props.map((p) => p.mesh), ...KEY_OF.keys()], true);
  for (const h of hits) {
    let o = h.object; while (o && !o.userData.prop && !KEY_OF.has(o)) o = o.parent;
    if (!o) continue;
    if (o.userData.prop) {
      const b = o.userData.prop.body, d = ray.ray.direction;
      b.wakeUp(); b.applyImpulse(new CANNON.Vec3(d.x * b.mass * 4.5, b.mass * 2.2, d.z * b.mass * 4.5), new CANNON.Vec3(h.point.x - b.position.x, h.point.y - b.position.y, h.point.z - b.position.z));

  }
});
renderer.domElement.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') outlines.hover(outlines.pick({ pointer: ndc(e), reach: 120 })); });
function resize() { const w = host.clientWidth, h = host.clientHeight; camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); gfx.resize(w, h); outlines.resize(); }
new ResizeObserver(resize).observe(host);

// ---------- lighting by time of day and weather ----------
const C3 = (h) => lin(h);
const SKY = { dayT: C3('#4d8ed8'), dayH: C3('#c4e2f3'), setT: C3('#46679f'), setH: C3('#f3a35a'), nightT: C3('#070d1a'), nightH: C3('#16223a'), grey: C3('#8f9aa3') };
const tmpC = new THREE.Color(), tmpC2 = new THREE.Color();
function dimReflections(day) {
  // the reflection environment is a fixed bright room, so scale it with daylight or nights glow
  if (!envMats) { envMats = new Set(); scene.traverse((o) => { if (o.isMesh && o.material && o.material.isMeshStandardMaterial) envMats.add(o.material); }); }
  if (Math.abs(day - lastDay) < 0.02) return; lastDay = day;
  envMats.forEach((m) => { m.envMapIntensity = 0.08 + 0.92 * day; });
}
const NIGHT_GRADE = { exposure: 0.78, contrast: 1.08, saturation: 0.62, temp: -0.14, tint: 0, lift: [0, 0.004, 0.016], gain: [0.88, 0.96, 1.1] };
let gradeMode = 'farm';
function applyLighting() {
  const e = env.sunDir.y, wf = weather === 'clear' ? 0 : weather === 'cloudy' ? 0.55 : 0.75;
  const day = THREE.MathUtils.smoothstep(e, -0.08, 0.3), sunset = Math.max(0, 1 - Math.abs(e - 0.04) / 0.18);
  tmpC.copy(SKY.nightT).lerp(SKY.dayT, day).lerp(SKY.setT, sunset * 0.5); tmpC.lerp(SKY.grey.clone().multiplyScalar(0.25 + day * 0.75), wf);
  tmpC2.copy(SKY.nightH).lerp(SKY.dayH, day).lerp(SKY.setH, sunset * 0.8); tmpC2.lerp(SKY.grey.clone().multiplyScalar(0.3 + day * 0.85), wf);
  skyU.top.value.copy(tmpC); skyU.horizon.value.copy(tmpC2); skyU.bottom.value.copy(tmpC2).multiplyScalar(0.7);
  skyU.sunDir.value.copy(env.sunDir); skyU.sunCol.value.setRGB(1, 0.85 - sunset * 0.3, 0.6 - sunset * 0.35).multiplyScalar((1 - wf) * (e > -0.02 ? 1 : 0));
  scene.fog.color.copy(tmpC2);
  const up = e > -0.02;
  const dir = up ? env.sunDir : new V(-env.sunDir.x, -env.sunDir.y, -env.sunDir.z * 0.5).normalize();
  sun.position.copy(sun.target.position).addScaledVector(dir, 90);
  sun.intensity = up ? 2.1 * THREE.MathUtils.smoothstep(e, -0.02, 0.18) * (1 - wf * 0.75) : 0.22;
  sun.color.setRGB(1, up ? 0.92 - sunset * 0.35 : 0.8, up ? 0.8 - sunset * 0.45 : 1).multiplyScalar(up ? 1 : 0.6);
  hemi.intensity = 0.12 + 0.85 * day; dimReflections(day);
  const mode = e < -0.04 ? 'night' : e < 0.12 ? 'dusk' : 'farm';
  if (mode !== gradeMode) { gradeMode = mode; gfx.setGrade(mode === 'night' ? NIGHT_GRADE : GRADES[mode], 2.5); } hemi.color.copy(tmpC2).lerp(new THREE.Color(1, 1, 1), 0.4);
  const lit = grid.powered.lights && env.dark;
  lamps.forEach((l) => { l.light.intensity = lit ? 2.2 : 0; l.lens.material.emissiveIntensity = lit ? 7 : 0; });
  tr.headlights.forEach((m) => { m.material.emissiveIntensity = drive.on && env.sunDir.y < 0.15 ? 8 : 0; });
  cloudMat.color.setRGB(1, 1, 1).multiplyScalar((0.35 + 0.65 * day) * (weather === 'rain' ? 0.6 : 1));
  clouds.forEach((c, i) => { c.visible = i < (weather === 'clear' ? 4 : 12); });
  rain.visible = weather === 'rain';
}

// ---------- processing line visuals ----------
const itemMeshes = new Map(), binPile = [];
const gWsh = glow.attach(wsh.root, { state: 'running' }); gWsh.led({ position: wsh.ledAt, size: 0.03 });
const gCut = glow.attach(cut.root, { state: 'running' }); gCut.stackLight({ position: new V(0.15, 1.96, -0.6), radius: 0.035, segment: 0.07 });
const gPak = glow.attach(pak.root, { state: 'running' }); gPak.stackLight({ position: pak.ledAt, radius: 0.035, segment: 0.07 });
for (let i = 0; i < 8; i++) { const m = new THREE.Mesh(LP.item('radish', true), LP.material()); m.castShadow = true; m.position.set(LX0 + 0.75 + ((i % 3) - 1) * 0.22, 1.02, LZ + (Math.floor(i / 3) - 1) * 0.22); m.rotation.y = i * 1.3; m.visible = false; scene.add(m); binPile.push(m); }
let gearSpin = 0;
function animateLine(dt) {
  const run = lineSim.running(), v = run ? lineSim.level.beltSpeed * lineSim.efficiency() * speed : 0;

    let m = itemMeshes.get(it.id);
    if (!m) { m = new THREE.Mesh(LP.item(it.crop, true), LP.material()); m.castShadow = true; m.rotation.y = it.rot; scene.add(m); itemMeshes.set(it.id, m); m.userData.clean = false; }
    if (it.washed && !m.userData.clean) { m.geometry = LP.item(it.crop, false); m.userData.clean = true; }
    m.position.set(ZX(it.s), LN.BELT_Y + 0.005, LZ + it.z);
    seen.add(it.id);
  });
  itemMeshes.forEach((m, id) => { if (!seen.has(id)) { scene.remove(m); itemMeshes.delete(id); } });
  binPile.forEach((m, i) => { m.visible = i < Math.min(8, Math.ceil(lineSim.bin.length / 3)); if (lineSim.bin[0] && m.userData.crop !== lineSim.bin[0].crop) { m.geometry = LP.item(lineSim.bin[0].crop, true); m.userData.crop = lineSim.bin[0].crop; } });

  gearSpin += v * dt * 6; cut.gears.forEach((g, i) => { g.g.rotation.z = (i ? -1 : 1) * gearSpin * (0.09 / g.r); });
  cut.heat.forEach((h) => { h.material.emissiveIntensity = run ? 3 : 0.1; });
  const st = lineSim.status(); [gWsh, gCut, gPak].forEach((g) => g.setState(st));
  vend.screen.material.emissiveIntensity = grid.powered.lights ? 1.3 : 0; vend.lamp.material.emissiveIntensity = grid.powered.lights ? 2 : 0;
}

// ---------- loop ----------
let paintT = 0, screenT = 0, uiT = 0, aviT = 0;
function frame(dt) {
  const simDt = dt * speed, n = Math.max(1, Math.ceil(simDt / 0.1));
  for (let i = 0; i < n; i++) simStep(simDt / n);
  physicsStep(dt);
  tw.animate(dt, wind, env); sa.animate(dt, solar); tk.animate(dt, tank); pj.animate(dt, pump); dr.animate(dt, drone);
  gen.animate(dt * Math.min(speed, 4), gsim, { reason: gsim.reason() });
  fx.update(dt, dr, drone);
  bess.fans.forEach((f) => { f.rotation.z += dt * (grid.flows.battIn + grid.flows.battOut > 0.1 ? 14 : 3); });
  Object.entries(dp.breakers).forEach(([k, b]) => {
    const on = k === 'main' ? !grid.mainTripped : grid.breakers[k];
    b.handle.rotation.x += ((on ? -0.45 : 0.45) - b.handle.rotation.x) * Math.min(1, dt * 10);
    gBrk[k].setState(k === 'main' ? (grid.mainTripped ? 'stopped' : 'running') : !grid.breakers[k] ? 'off' : grid.powered[k] ? 'running' : 'waiting');
  });
  // status lights
  gW.setState(wind.status()); gS.setState(solar.status());
  aviT += dt; gAv.setState(Math.floor(aviT * 1.2) % 2 ? 'stopped' : 'off');
  gT.setState(tank.status() === 'stopped' ? 'stopped' : tank.inLpm + tank.outLpm > 0.1 ? 'flow' : 'waiting');
  gP.setState(pump.status()); gC.setState(drone.charging ? 'flow' : !grid.powered.charger ? 'stopped' : drone.state === 'charge' ? 'waiting' : 'running');
  gB.setState(grid.flows.battIn + grid.flows.battOut > 0.05 ? 'flow' : grid.soc / grid.level.batteryKwh < 0.15 ? 'waiting' : 'running');
  gG.setState(gsim.status());
  trough.water.scale.y = 1; trough.water.visible = tank.valveOpen && tank.volumeL > 10;
  paintT -= dt; if (paintT <= 0) { paintT = 0.4; paintField(); }
  animateLine(dt);
  screenT -= dt; if (screenT <= 0) { screenT = 0.5; drawScreens(); }
  clouds.forEach((c) => { c.position.x += c.userData.v * dt * (0.5 + env.wind * 0.15); if (c.position.x > 160) c.position.x = -160; });
  if (rain.visible) { const p = rainG.attributes.position, t = controls.target; for (let i = 0; i < rainN; i++) { let y = p.getY(i) - dt * 14; if (y < 0) y += 30; p.setY(i, y); } rain.position.set(t.x, 0, t.z); p.needsUpdate = true; }
  applyLighting();
}
window.__fw = { lineSim, fieldSim, buildFieldMeshes, tr, camera, controls, wind, solar, tank, pump, drone, grid, gsim, field, props, chassis, vehicle, select, openInspect, frame, render, setTab: (t) => $('tab-' + t).click(), doAction, setHour: (h) => { hour = h; updateEnv(); }, setWind: (w) => { windBase = w; }, setWeather: (w) => { weather = w; }, setSpeed: (s) => { speed = s; }, step: (secs, sp) => { const s0 = speed; speed = sp || 1; for (let i = 0; i < secs * 30; i++) frame(1 / 30); speed = s0; }, drive, setDriving, gfx };
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  frame(dt);
  if (drive.on) {
    const p = chassis.position, back = new V(0, 0, -1).applyQuaternion(tr.root.quaternion).setY(0).normalize();
    const want = new V(p.x + back.x * 8.5, p.y + 3.6, p.z + back.z * 8.5);
    camera.position.lerp(want, Math.min(1, dt * 3)); controls.target.lerp(new V(p.x, p.y + 1, p.z), Math.min(1, dt * 6)); camera.lookAt(controls.target);
  } else if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt / 1.1); const e = camAnim.t * camAnim.t * (3 - 2 * camAnim.t);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e); controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  glow.update(dt, camera); outlines.update(dt); if (!drive.on) controls.update();
  uiT -= dt; if (uiT <= 0) { uiT = 0.25; render(false); }
  gfx.render(dt);
  requestAnimationFrame(loop);
}
updateEnv(); applyLighting();
camera.position.set(...VIEWS.overview.pos); controls.target.set(...VIEWS.overview.tgt); controls.update();
$('b-inspect').hidden = true; $('note').textContent = NOTES.overview;
syncPhysics(); drawScreens(); resize(); render(true); loop();
</script>
