<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style><body></body>
<script type="importmap">{"imports":{"three":"./three.module.js","three/examples/jsm/":"./jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { createGraphics } from './graphics.js';
import { createGlow } from './glow.js';
window.THREE = THREE;
const load = (src) => new Promise((r) => { const s = document.createElement('script'); s.src = src; s.onload = r; document.head.appendChild(s); });
await load('crops.js'); await load('station.js');
const q = new URLSearchParams(location.search), withGlow = q.get('glow') !== '0', shot = q.get('shot') || 'line', washer = q.get('washer') || 'running';
const W = 1280, H = 820, V = THREE.Vector3;
const renderer = new THREE.WebGLRenderer(); renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#2c3a55'); scene.fog = new THREE.Fog(new THREE.Color('#202a3e'), 12, 45);
scene.add(new THREE.HemisphereLight(new THREE.Color('#6c7fa6'), new THREE.Color('#2a2118'), 0.35));
const sun = new THREE.DirectionalLight(new THREE.Color('#ffb070'), 0.7); sun.position.set(-6, 3, 4); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, far: 30 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: new THREE.Color('#4f5a33').convertSRGBToLinear(), roughness: 1 }));
ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);
const slab = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.04, 4.4), new THREE.MeshStandardMaterial({ color: new THREE.Color('#8f8c86').convertSRGBToLinear(), roughness: 0.45 }));
slab.position.set(0.15, 0, -0.3); slab.receiveShadow = true; scene.add(slab);
const st = FWStation.build({}); scene.add(st.group);
const L = FWCrops.leafTexture(), tex = new THREE.DataTexture(L.data, L.width, L.height); tex.generateMipmaps = true; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.needsUpdate = true;
const mk = (r) => { const m = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: r, map: tex }); m.color.setScalar(L.colorBoost); return m; };
[1.5, 2.25].forEach((x, i) => { const m = new THREE.Mesh(FWCrops.CROPS.pumpkin.produce({ seed: i + 1 }), mk(0.5)); const bb = m.geometry.boundingBox; m.position.set(x - (bb.min.x + bb.max.x) / 2, 0.8 - bb.min.y, 0); m.castShadow = true; scene.add(m); });
const gfx = createGraphics({ renderer, scene, camera: new THREE.PerspectiveCamera(), sun, storageKey: 'g' + Math.random() });
gfx.setPreset('high'); gfx.setGrade('dusk', 0);
const camera = new THREE.PerspectiveCamera(38, W / H, 0.05, 200); gfx.setCamera(camera);
const shots = { line: [[3.6, 2.2, 4.4], [0, 0.85, 0]], washer: [[1.3, 1.35, 2.3], [0, 1.0, 0.2]], pump: [[2.0, 1.3, -2.7], [-0.1, 0.55, -0.8]] };
camera.position.set(...shots[shot][0]); camera.lookAt(...shots[shot][1]);
const glow = createGlow({ scene, quality: 'high' });
if (withGlow) {
  const g = st.group, M = st.materials;
  // washer: adopt the existing stack light and control-panel screen, add trim strips
  const wash = glow.attach(g, { state: washer });
  wash.adopt(st.beacon.red, 'stack', 'stopped'); wash.adopt(st.beacon.amber, 'stack', 'waiting'); wash.adopt(st.beacon.green, 'stack', 'running');
  g.traverse((o) => { if (o.isMesh && o.material === M.screen) wash.adopt(o, 'screen'); });
  wash.strip({ from: new V(-0.86, 0.795, 0.525), to: new V(0.86, 0.795, 0.525), width: 0.014 });
  wash.strip({ from: new V(-0.9, 1.69, 0.535), to: new V(0.9, 1.69, 0.535), width: 0.014 });
  wash.led({ position: new V(-1.13, 1.03, 0.79) });
  // conveyors: strip under each outer rail, LED on each motor
  const infeed = glow.attach(g, { state: 'waiting' });
  infeed.strip({ from: new V(-3.1, 0.765, 0.335), to: new V(-0.92, 0.765, 0.335) });
  infeed.led({ position: new V(-3.05, 0.84, -0.61) });
  const outfeed = glow.attach(g, { state: washer === 'stopped' ? 'stopped' : 'running' });
  outfeed.strip({ from: new V(0.92, 0.765, 0.335), to: new V(3.0, 0.765, 0.335) });
  outfeed.led({ position: new V(2.95, 0.84, -0.61) });
  // water: pump LED and a sight-glass strip on the tank
  const water = glow.attach(g, { state: washer === 'stopped' ? 'off' : 'flow' });
  water.led({ position: new V(0.42, 0.31, -0.95), size: 0.016 });
  water.strip({ from: new V(-0.25, 0.1, -1.265), to: new V(-0.25, 0.66, -1.265), width: 0.02 });
  water.strip({ from: new V(-0.35, 1.53, -0.56), to: new V(0.35, 1.53, -0.56), width: 0.01 });
}
let n = 0;
function frame() {
  for (let i = 0; i < 6; i++) glow.update(1 / 60, camera);
  gfx.render(1 / 60);
  if (++n < 20) requestAnimationFrame(frame); else window.done = true;
}
frame();
</script>
