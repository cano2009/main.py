<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style><body></body>
<script type="importmap">{"imports":{"three":"./three.module.js","three/examples/jsm/":"./jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { createGraphics } from './graphics.js';
window.THREE = THREE;
const load = (src) => new Promise((r) => { const s = document.createElement('script'); s.src = src; s.onload = r; document.head.appendChild(s); });
await load('crops.js'); await load('station.js');
const q = new URLSearchParams(location.search), mode = q.get('mode') || 'before', preset = q.get('preset') || 'high', shot = q.get('shot') || 'washer';
const W = 1280, H = 860;
const renderer = new THREE.WebGLRenderer({ antialias: mode === 'before' }); renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#a9bfcc'); scene.fog = new THREE.Fog(new THREE.Color('#cdbf98'), 14, 60);

const sun = new THREE.DirectionalLight(new THREE.Color('#fff1d6'), 2.4); sun.position.set(4, 7, 3.5); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, far: 30 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: new THREE.Color('#6f7f3e').convertSRGBToLinear(), roughness: 1 }));
ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);
const slab = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.04, 4.4), new THREE.MeshStandardMaterial({ color: new THREE.Color('#8f8c86').convertSRGBToLinear(), roughness: 0.55, metalness: 0 }));
slab.position.set(0.15, 0, 0); slab.receiveShadow = true; scene.add(slab);
const st = FWStation.build({}); scene.add(st.group);
st.group.traverse((o) => { if (o.material && o.material.name === 'light_green') o.material.emissiveIntensity = 3; if (o.material && o.material.name === 'screen') o.material.emissiveIntensity = 2.2; });
const L = FWCrops.leafTexture(), tex = new THREE.DataTexture(L.data, L.width, L.height); tex.generateMipmaps = true; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.needsUpdate = true;
const mk = (r) => { const m = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: r, map: tex }); m.color.setScalar(L.colorBoost); return m; };
[-2.6, -1.9, -1.2].forEach((x, i) => { const m = new THREE.Mesh(FWCrops.CROPS.pumpkin.produce({ dirty: true, seed: i + 1 }), mk(0.9)); const bb = m.geometry.boundingBox; m.position.set(x - (bb.min.x + bb.max.x) / 2, 0.8 - bb.min.y, 0); m.castShadow = true; scene.add(m); });
[1.4, 2.1].forEach((x, i) => { const m = new THREE.Mesh(FWCrops.CROPS.pumpkin.produce({ seed: i + 1 }), mk(0.5)); const bb = m.geometry.boundingBox; m.position.set(x - (bb.min.x + bb.max.x) / 2, 0.8 - bb.min.y, 0); m.castShadow = true; scene.add(m); });
const pm = mk(0.82);
for (let i = 0; i < 5; i++) for (let j = 0; j < 2; j++) { const m = new THREE.Mesh(FWCrops.CROPS.tomato.clump({ stage: 4, seed: i * 2 + j + 1 }), pm); m.position.set(-3.5 + i * 1.0, 0, -2.6 - j * 1.0); m.castShadow = m.receiveShadow = true; scene.add(m); }
const camera = new THREE.PerspectiveCamera(38, W / H, 0.05, 200);
if (shot === 'washer') { camera.position.set(2.6, 2.0, 3.6); camera.lookAt(0.1, 0.9, 0); } else { camera.position.set(-0.6, 1.3, 1.8); camera.lookAt(-1.6, 0.9, -0.2); }
let gfx = null;
if (mode === 'after') { gfx = createGraphics({ renderer, scene, camera, sun, storageKey: 'test' + Math.random() }); gfx.setPreset(preset); gfx.setGrade(q.get('grade') || 'farm', 0); const ov={}; if(q.get('env')) ov.reflections=q.get('env'); if(q.get('ao')) ov.ao=q.get('ao')==='1'; if(q.get('bloom')) ov.bloom=q.get('bloom')==='1'; if(Object.keys(ov).length) gfx.set(ov); }
const t0 = performance.now(); let n = 0;

  if (gfx) gfx.render(1 / 60); else renderer.render(scene, camera);
  n++;
  if (n < 4) requestAnimationFrame(frame);
  else { window.ms = (performance.now() - t0) / n; window.info = gfx ? gfx.info() : { drawCalls: renderer.info.render.calls }; window.done = true; }
}
frame();
</script>
